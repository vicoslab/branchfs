name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('Cargo.toml').read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit('Cargo.toml package version not found')
          print(match.group(1))
          PY
          )
          test "$tag_version" = "$cargo_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $cargo_version" >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3

      - name: Install FUSE (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask macfuse

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary tarball
        run: |
          tar czf branchfs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release branchfs

      - name: Build Python binary wheel (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip build wheel
          branchfs_bin="target/${{ matrix.target }}/release/branchfs"
          ldd "$branchfs_bin"
          BRANCHFS_BIN_VERSION="${GITHUB_REF_NAME#v}" \
          BRANCHFS_BIN_BINARY="$PWD/$branchfs_bin" \
            bash -c 'cd python/branchfs-bin && python3 -m build --wheel'
          wheel=$(echo python/branchfs-bin/dist/vicoslab_branchfs_bin-*.whl)
          python3 -m pip install --force-reinstall "$wheel"
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import branchfs_bin

          path = branchfs_bin.branchfs_path()
          print('packaged branchfs:', path)
          if not os.path.exists(path):
              raise SystemExit('packaged branchfs binary missing')
          if branchfs_bin.__version__ != os.environ['GITHUB_REF_NAME'].lstrip('v'):
              raise SystemExit('wheel version mismatch')
          proc = subprocess.run([path, '--version'], text=True,
                                stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          sys.stdout.write(proc.stdout)
          sys.stderr.write(proc.stderr)
          if proc.returncode != 0:
              raise SystemExit(proc.returncode)
          PY
          branchfs --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: branchfs-${{ matrix.target }}
          path: |
            branchfs-*.tar.gz
            python/branchfs-bin/dist/*.whl
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.whl
          generate_release_notes: true

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Skipping crates.io publish because CARGO_REGISTRY_TOKEN is not configured."
            exit 0
          fi
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
